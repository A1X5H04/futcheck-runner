<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      padding: 82px 80px;
      overflow: hidden;
      color: #f4f6f2;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(ellipse at 82% 15%, color-mix(in srgb, {{ACCENT}} 22%, transparent), transparent 50%),
        linear-gradient(135deg, #111315, #202428 55%, #101214);
    }
    .brand { display: flex; align-items: center; gap: 22px; font-size: 28px; font-weight: 800; letter-spacing: 4px; }
    .brand-mark { width: 8px; height: 44px; border-radius: 4px; background: {{ACCENT}}; }
    .copy { margin-top: 165px; }
    .eyebrow { color: {{ACCENT}}; font-size: 25px; font-weight: 700; letter-spacing: 5px; }
    h1 { max-width: 920px; margin: 42px 0 28px; font-size: 91px; line-height: 1.04; letter-spacing: -3px; }
    .subtitle { max-width: 850px; color: #cfd3d0; font-size: 34px; line-height: 1.35; }
    .feature { display: flex; align-items: center; gap: 55px; margin-top: auto; min-height: 300px; padding: 55px 70px; border: 1px solid #ffffff22; border-radius: 30px; background: #ffffff0e; }
    .orb { display: grid; place-items: center; width: 168px; height: 168px; flex: 0 0 auto; border: 3px solid {{ACCENT}}aa; border-radius: 50%; color: {{ACCENT}}; font-size: 76px; }
    .feature-title { font-size: 34px; font-weight: 700; }
    .feature-copy { margin-top: 20px; color: #aeb5b0; font-size: 25px; }
    footer { display: flex; justify-content: space-between; margin-top: 65px; color: #858d88; font-size: 20px; letter-spacing: 3px; }
  </style>
</head>
<body>
  <header class="brand"><span class="brand-mark"></span><span>FUTCHECK</span></header>
  <main class="copy">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{TITLE}}</h1>
    <div class="subtitle">{{SUBTITLE}}</div>
  </main>
  <section class="feature">
    <div class="orb">✦</div>
    <div>
      <div class="feature-title">Built for your club.</div>
      <div class="feature-copy">A sample template for browser-based rendering.</div>
    </div>
  </section>
  <footer><span>THE FUT ECOSYSTEM, BUILT AROUND YOU.</span><span>01 / 01</span></footer>
</body>
</html>
