name: Runner CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate contracts and scripts
        run: ./scripts/validate.sh

      - name: SVG container smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/futcheck-output"
          ./runner/execute.sh \
            --job examples/jobs/render-svg.json \
            --input examples/input \
            --output "$RUNNER_TEMP/futcheck-output"
          test -s "$RUNNER_TEMP/futcheck-output/post.png"
          jq -e '.status == "completed" and .output.files[0].format == "png"' \
            "$RUNNER_TEMP/futcheck-output/manifest.json"
